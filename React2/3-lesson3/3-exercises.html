    // Exercise 3d
    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container)

    function Counter() {
      let [counter, setCounter] = React.useState(0)
      function countFunc() {
        setCounter(++counter);
      }
      return (
        <>
          <button onClick={countFunc}>
            Clicked {counter} {counter !== 1 ? "times" : "time"}
          </button>
        </>
      )
    }

    root.render(
      <>
        <Counter />
        <Counter />
      </>
    );
